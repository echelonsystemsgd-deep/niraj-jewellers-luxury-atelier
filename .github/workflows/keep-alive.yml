name: Supabase Free Tier Keep-Alive
on:
  schedule:
    # Run every 48 hours at 04:00 UTC to perpetually reset the 7-day inactivity pause
    - cron: "0 4 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_tt6MYlYB0lpkiwj_3v_Z-w_-5lw9NCx' }}" \
            "https://dablevnhwzqxjivohfoj.supabase.co/rest/v1/global_settings?select=id&limit=1" || echo "Keep-alive ping completed"
