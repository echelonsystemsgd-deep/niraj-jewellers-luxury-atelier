<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#09090B" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.6" />

  <!-- Diamond Crest -->
  <polygon points="32,8 37,13 32,18 27,13" fill="none" stroke="url(#gold)" stroke-width="1.2" />

  <!-- Monogram NJ -->
  <g fill="url(#gold)" font-family="Georgia, serif" font-weight="bold" font-size="22" letter-spacing="-1">
    <text x="14" y="44">N</text>
    <text x="31" y="46" font-size="24">J</text>
  </g>
  <!-- Micro Star -->
  <circle cx="32" cy="55" r="1.2" fill="url(#gold)" />
</svg>
